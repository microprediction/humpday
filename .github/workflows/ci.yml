name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with ruff
      run: |
        ruff check .
        ruff format --check .

    - name: Type check with mypy
      run: |
        mypy humpday
      continue-on-error: true  # Allow to fail for now

    - name: Test with pytest
      run: |
        pytest -v --cov=humpday --cov-report=xml --cov-report=term-missing



    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  portable-contract:
    runs-on: ubuntu-latest
    name: Portable contract (pure backend, py${{ matrix.python-version }})
    strategy:
      matrix:
        # Both sides of the CPython 3.12 sum() semantics change — the
        # left-fold summation pass makes trajectories version-independent,
        # and this matrix proves it stays that way.
        python-version: ["3.11", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install
      run: |
        python -m pip install --upgrade pip
        pip install -e . pytest
    - name: Replay transition vectors + PRNG parity
      env:
        HUMPDAY_FORCE_PURE_ARRAY: "1"
      run: |
        pytest tests/test_transition_vectors.py tests/test_prng_parity.py tests/test_portable_rng_mode.py -q

  test-minimal:
    runs-on: ubuntu-latest
    name: Test minimal dependencies
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: "3.9"

    - name: Install minimal dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .  # Only core dependencies

    - name: Test core functionality
      run: |
        python -c "import humpday; print('Import successful')"
        python -c "from humpday import minimize, suggest; print('Core functions available')"
  wheel-contract:
    runs-on: ubuntu-latest
    name: Installed wheel (console scripts)
    # The package's contract with an installed user, checked the only way it can be: build the
    # wheel, install it somewhere that is not the checkout, and run what the metadata advertises.
    # `humpday = "humpday.__main__:main"` was declared for several releases with no such module,
    # and every source-tree test passed throughout.
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Build the wheel
      run: |
        python -m pip install --upgrade pip build
        python -m build --wheel

    - name: Install it outside the checkout and run every console script
      run: |
        python -m venv /tmp/wheel-venv
        /tmp/wheel-venv/bin/pip install dist/*.whl
        cd "$(mktemp -d)"
        /tmp/wheel-venv/bin/python -c "import humpday; print(humpday.__version__)"
        /tmp/wheel-venv/bin/humpday --version
        /tmp/wheel-venv/bin/humpday suggest --dim 8 --trials 200 -n 3
        /tmp/wheel-venv/bin/humpday recommend --dim 8 --trials 200
        /tmp/wheel-venv/bin/humpday --json ratings --dim 8
        /tmp/wheel-venv/bin/python -m humpday --help
