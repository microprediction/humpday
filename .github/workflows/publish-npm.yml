name: Publish JS roster to npm

# Publishes docs/js/modules (the JavaScript twin of the Python roster) to npm
# when a GitHub Release is published, after re-checking Python<->JS parity.
# Bump the version in docs/js/modules/package.json before tagging the release.
#
# Requires a repo secret NPM_TOKEN (an npm "Automation" access token — the
# same token used by the skaters repo works; add it under Settings > Secrets).

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # npm provenance
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (parity reference)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Python package with test deps
        run: |
          pip install -e ".[fast]"
          pip install pytest

      - name: Versions must agree before anything is published
        # docs/js/modules/package.json is bumped by hand, and when that is forgotten the release
        # runs all the way to `npm publish` and dies on a 403 for republishing an existing
        # version. Fail here instead, naming both files, while nothing has been shipped.
        run: |
          PY_VER=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          JS_VER=$(python -c "import json; print(json.load(open('docs/js/modules/package.json'))['version'])")
          echo "pyproject.toml            $PY_VER"
          echo "docs/js/modules/package.json  $JS_VER"
          if [ "$PY_VER" != "$JS_VER" ]; then
            echo "::error::Version mismatch. Bump docs/js/modules/package.json to $PY_VER and re-tag."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Parity gate (Python and JS must agree before shipping)
        run: python -m pytest tests/test_js_parity.py -q

      - name: Publish to npm
        working-directory: docs/js/modules
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
